[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serein"
version = "0.1.0"
description = "Authored memories, evidence, and independent surfacing decisions"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "jieba==0.42.1", "setuptools<81", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
mcp = ["mcp>=1.27,<2"]
tokenizer = ["transformers>=4.40,<5"]
embedding = ["httpx>=0.27,<1"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=1.27,<2"]
background = ["openai>=1.60,<3"]

[project.scripts]
serein = "serein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"serein" = ["resources/*.json", "resources/*.md", "resources/agents/*/AGENTS.md"]
"serein.core" = ["*.sql"]
"serein.recall.germany" = ["resources/*.json", "resources/stopwords/*.txt", "PROVENANCE.md"]
"serein.compat.germany" = ["PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
