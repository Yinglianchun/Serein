name: Route recovery validation
on:
  push:
    branches: [Haven/fix-route-history-recovery]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel '.[test,http,background]' --wheel-dir "$RUNNER_TEMP/wheels"
      - uses: actions/upload-artifact@v4
        with:
          name: route-recovery-test-wheels-313
          path: ${{ runner.temp }}/wheels/*.whl
          retention-days: 1
