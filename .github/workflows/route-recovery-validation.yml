name: Route recovery validation
on:
  push:
    branches: [Haven/fix-route-history-recovery]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked integration patch
        run: |
          echo '1092a02124ff9531081cb57c69017ad9784752fd97ac91b7ccb25be2ab30d8e2  .github/route-recovery-integrate.patch' | sha256sum -c -
          git apply --check .github/route-recovery-integrate.patch
          git apply .github/route-recovery-integrate.patch
          git diff --check
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/baseline"
          git archive 2d79a0a4a32fcc4f82d9101367d12a971241d8f1 | tar -x -C "$RUNNER_TEMP/baseline"
      - run: python -m pip install '.[test,http,background]'
      - name: Focused behavior regressions
        run: |
          python -m pytest -q tests/test_pipeline_route_history.py tests/test_pipeline_limits.py tests/test_latest_pipeline.py tests/test_public_features.py tests/test_track_continuation_parity.py tests/test_event_handoff.py tests/test_pipeline_scenes.py --junitxml="$RUNNER_TEMP/reports/focused.xml" | tee "$RUNNER_TEMP/reports/focused.log"
      - name: Full backend and clean baseline comparison
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml="$RUNNER_TEMP/reports/full.xml" > "$RUNNER_TEMP/reports/full.log" 2>&1
          full_status=$?
          (cd "$RUNNER_TEMP/baseline" && python -m pytest -q tests/test_narrative_theme.py --junitxml="$RUNNER_TEMP/reports/baseline.xml") > "$RUNNER_TEMP/reports/baseline.log" 2>&1
          baseline_status=$?
          set -e
          cat "$RUNNER_TEMP/reports/full.log"
          test "$full_status" -le 1
          test "$baseline_status" -le 1
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'
          def failures(name):
              root=ET.parse(folder/name).getroot()
              return {(c.get('classname'),c.get('name')) for c in root.iter('testcase') if c.find('failure') is not None or c.find('error') is not None}
          expected={('tests.test_narrative_theme', 'test_configured_discovery_transport_and_output_budget[openai]'), ('tests.test_narrative_theme', 'test_configured_discovery_transport_and_output_budget[anthropic]')}
          current=failures('full.xml'); baseline=failures('baseline.xml')
          assert current == baseline == expected, (current,baseline)
          text='Focused regressions pass. Full suite has exactly two pre-existing narrative-theme token-cap assertions, also failing on clean main 2d79a0a; no new full-suite failures. These unrelated tests/runtime are unchanged.'
          (folder/'validation-note.txt').write_text(text+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text+'\n')
          print('::warning::Full backend suite is not fully green: two clean-baseline narrative-theme assertions remain. See reports.')
          PY
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci
          npm test | tee "$RUNNER_TEMP/reports/frontend.log"
          npm run build | tee "$RUNNER_TEMP/reports/build.log"
      - name: Compile and release manifest
        run: |
          python -m compileall -q src tests
          python scripts/release.py "$RUNNER_TEMP/route-recovery-release.zip"
          git diff --check
          git diff --name-only > "$RUNNER_TEMP/reports/changed-files.txt"
          python - <<'PY'
          import hashlib,json,pathlib,os
          paths=['docs/route-recovery.md','release-files.json','src/serein/api/imports.py','src/serein/api/mcp.py','src/serein/extensions/pipeline.py','src/serein/extensions/pipeline_recovery.py','tests/test_pipeline_route_history.py','web/src/components/PipelineSettings.jsx','web/tests/gateway.test.mjs','web/vite.config.mjs']
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'/'source-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - name: Materialize only tested changes on repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/Haven/fix-route-history-recovery | cut -f1)" = "$EXPECTED_HEAD"
          git add release-files.json src/serein/api/imports.py src/serein/api/mcp.py src/serein/extensions/pipeline.py src/serein/extensions/pipeline_recovery.py tests/test_pipeline_route_history.py web/src/components/PipelineSettings.jsx web/tests/gateway.test.mjs web/vite.config.mjs
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: integrate verified historical route recovery and confirmed rebuild'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/Haven/fix-route-history-recovery
          git rev-parse HEAD > "$RUNNER_TEMP/reports/materialized-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-recovery-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/reports/
          retention-days: 7
