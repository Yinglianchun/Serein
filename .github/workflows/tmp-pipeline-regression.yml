name: temporary pipeline regression

on:
  push:
    branches:
      - Haven/pipeline-resilience-sync-20260926

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,http,background,embedding]"
      - run: pytest -q tests/test_latest_pipeline.py tests/test_file_imports.py
