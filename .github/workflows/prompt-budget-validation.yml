name: Prompt budget regression validation

on:
  push:
    branches: [Haven/fix-prompt-budget-rebatch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install '.[test,http,background]'
      - name: Focused prompt-budget regressions
        run: python -m pytest -q tests/test_pipeline_limits.py tests/test_public_settings.py tests/test_pipeline_route_history.py tests/test_latest_pipeline.py tests/test_event_writer_concurrency.py
      - name: Full backend
        run: python -m pytest -q
      - name: Frontend build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Compile, package, diff check
        run: |
          python -m compileall -q src tests
          python scripts/release.py "$RUNNER_TEMP/serein-release.zip"
          git diff --check
