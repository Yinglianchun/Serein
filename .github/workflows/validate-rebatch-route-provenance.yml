name: Validate rebatch route provenance

on:
  push:
    branches: [fix/rebatch-route-provenance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[test,http,embedding,background,mcp]'
      - name: Compile pipeline modules
        run: python -m py_compile src/serein/extensions/pipeline.py src/serein/extensions/pipeline_recovery.py
      - name: Run rebatch and route-history regressions
        run: python -m pytest -q tests/test_pipeline_limits.py tests/test_pipeline_route_history.py
